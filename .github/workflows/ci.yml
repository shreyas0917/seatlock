# CI: runs the SAME checks as scripts/verify.sh (gofmt, vet, markdown link check, promtool on the
# monitoring config, unit and
# integration tests) on every push and pull request, against real
# PostgreSQL 16 and Redis 7 service containers.
#
# On Linux, cgo is available, so tests also run with -race (the Go race
# detector), which cannot run on the Windows development machine.
# The k6 load smoke test runs in its own workflow (load-smoke.yml).
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seatlock
          POSTGRES_PASSWORD: seatlock
          POSTGRES_DB: seatlock_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U seatlock -d seatlock_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://seatlock:seatlock@localhost:5434/seatlock_test?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: go build -o /tmp/bin/ ./cmd/...

      - name: Verify (gofmt, vet, link check, promtool checks, unit + integration tests, with -race)
        run: TEST_FLAGS=-race ./scripts/verify.sh

      - name: Upload verify log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: tmp/verify-*.log
