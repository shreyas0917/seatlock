basePath: /
definitions:
  httpapi.BookingResponse:
    properties:
      created_at:
        example: "2026-11-07T10:00:00Z"
        type: string
      hold_id:
        example: 12
        type: integer
      id:
        example: 1
        type: integer
      seat_id:
        example: 7
        type: integer
      show_id:
        example: 1
        type: integer
      user_id:
        example: user-42
        type: string
    type: object
  httpapi.ConfirmBookingRequest:
    properties:
      hold_id:
        example: 12
        type: integer
    type: object
  httpapi.CreateHoldRequest:
    properties:
      seat_id:
        example: 7
        type: integer
      show_id:
        example: 1
        type: integer
    type: object
  httpapi.ErrorBody:
    properties:
      code:
        example: SEAT_ALREADY_BOOKED
        type: string
      message:
        example: this seat has already been booked
        type: string
    type: object
  httpapi.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/httpapi.ErrorBody'
    type: object
  httpapi.HoldResponse:
    properties:
      expires_at:
        example: "2026-11-07T10:05:00Z"
        type: string
      hold_id:
        example: 12
        type: integer
      seat_id:
        example: 7
        type: integer
      seconds_left:
        example: 300
        type: integer
      show_id:
        example: 1
        type: integer
      status:
        enum:
        - ACTIVE
        - CONSUMED
        - RELEASED
        - EXPIRED
        example: ACTIVE
        type: string
      user_id:
        example: user-42
        type: string
    type: object
  httpapi.ReadinessResponse:
    properties:
      postgres:
        enum:
        - up
        - down
        example: up
        type: string
      redis:
        enum:
        - up
        - down
        example: up
        type: string
    type: object
  httpapi.SeatMapResponse:
    properties:
      seats:
        items:
          $ref: '#/definitions/httpapi.SeatResponse'
        type: array
      show_id:
        example: 1
        type: integer
    type: object
  httpapi.SeatResponse:
    properties:
      id:
        example: 7
        type: integer
      label:
        example: A7
        type: string
      price_paise:
        example: 25000
        type: integer
      status:
        enum:
        - AVAILABLE
        - HELD
        - BOOKED
        example: AVAILABLE
        type: string
    type: object
  httpapi.ShowListResponse:
    properties:
      shows:
        items:
          $ref: '#/definitions/httpapi.ShowResponse'
        type: array
    type: object
  httpapi.ShowResponse:
    properties:
      id:
        example: 1
        type: integer
      starts_at:
        example: "2027-01-25T13:30:00Z"
        type: string
      title:
        example: Coldplay Live
        type: string
      venue:
        example: DY Patil Stadium, Navi Mumbai
        type: string
    type: object
  httpapi.StatusResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
info:
  contact: {}
  description: |-
    High-concurrency ticket booking backend. A seat can never be booked twice:
    PostgreSQL's UNIQUE(show_id, seat_id) constraint is the final authority.
  title: SeatLock API
  version: "1.0"
paths:
  /healthz:
    get:
      description: Returns 200 while the process is running. Does not check dependencies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.StatusResponse'
      summary: Liveness check
      tags:
      - health
  /readyz:
    get:
      description: |-
        Reports Postgres and Redis. Returns 200 whenever Postgres answers within 1s,
        even if Redis is down; returns 503 only when Postgres is down.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ReadinessResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.ReadinessResponse'
      summary: Readiness check
      tags:
      - health
  /v1/bookings:
    post:
      consumes:
      - application/json
      description: |-
        Turns the user's active hold into a booking. Uses PostgreSQL only, so it still
        works while Redis is down. Of several concurrent confirms of one hold, exactly
        one gets 201 and the rest get 409 HOLD_ALREADY_USED.
      parameters:
      - description: Owner of the hold
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: Hold to confirm
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.ConfirmBookingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.BookingResponse'
        "400":
          description: Bad input or missing X-User-ID
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: HOLD_NOT_FOUND (also for another user's hold)
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: HOLD_ALREADY_USED or SEAT_ALREADY_BOOKED
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "410":
          description: HOLD_EXPIRED
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "503":
          description: SERVICE_BUSY
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Confirm a hold into a booking
      tags:
      - bookings
  /v1/bookings/{bookingID}:
    get:
      parameters:
      - description: Booking ID
        in: path
        name: bookingID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.BookingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "503":
          description: Database busy
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get a booking
      tags:
      - bookings
  /v1/holds:
    post:
      consumes:
      - application/json
      description: |-
        Reserves a seat for the user for 5 minutes. Returns 201 for a new hold, or 200
        with the same hold if this user already holds the seat (safe to retry).
        If the seat lock (Redis) is unavailable, no hold is created: 503 LOCK_UNAVAILABLE.
      parameters:
      - description: Who is holding
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: Seat to hold
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateHoldRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Existing hold of this user
          schema:
            $ref: '#/definitions/httpapi.HoldResponse'
        "201":
          description: New hold
          schema:
            $ref: '#/definitions/httpapi.HoldResponse'
        "400":
          description: Bad input or missing X-User-ID
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Show or seat not found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: SEAT_HELD or SEAT_ALREADY_BOOKED
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "503":
          description: LOCK_UNAVAILABLE or SERVICE_BUSY
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Hold a seat
      tags:
      - holds
  /v1/holds/{holdID}:
    delete:
      description: |-
        Releases the user's active hold so others can take the seat. Works even when
        Redis is down (PostgreSQL is updated; the Redis lock then expires by TTL).
      parameters:
      - description: Owner of the hold
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: Hold ID
        in: path
        name: holdID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HoldResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: HOLD_NOT_FOUND (also for another user's hold)
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: HOLD_ALREADY_USED
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "410":
          description: HOLD_EXPIRED
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "503":
          description: SERVICE_BUSY
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Cancel a hold
      tags:
      - holds
  /v1/shows:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ShowListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "503":
          description: Database busy
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: List shows
      tags:
      - shows
  /v1/shows/{showID}/seats:
    get:
      description: |-
        Every seat of the show with its price and status (AVAILABLE, HELD or BOOKED),
        computed from PostgreSQL only.
      parameters:
      - description: Show ID
        in: path
        name: showID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.SeatMapResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "503":
          description: Database busy
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Seat map of a show
      tags:
      - shows
swagger: "2.0"
