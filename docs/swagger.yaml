basePath: /
definitions:
  httpapi.BookingResponse:
    properties:
      created_at:
        example: "2026-11-07T10:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      seat_id:
        example: 7
        type: integer
      show_id:
        example: 1
        type: integer
      user_id:
        example: user-42
        type: string
    type: object
  httpapi.CreateBookingRequest:
    properties:
      seat_id:
        example: 7
        type: integer
      show_id:
        example: 1
        type: integer
    type: object
  httpapi.ErrorBody:
    properties:
      code:
        example: SEAT_ALREADY_BOOKED
        type: string
      message:
        example: this seat has already been booked
        type: string
    type: object
  httpapi.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/httpapi.ErrorBody'
    type: object
  httpapi.SeatMapResponse:
    properties:
      seats:
        items:
          $ref: '#/definitions/httpapi.SeatResponse'
        type: array
      show_id:
        example: 1
        type: integer
    type: object
  httpapi.SeatResponse:
    properties:
      id:
        example: 7
        type: integer
      label:
        example: A7
        type: string
      price_paise:
        example: 25000
        type: integer
      status:
        enum:
        - AVAILABLE
        - BOOKED
        example: AVAILABLE
        type: string
    type: object
  httpapi.ShowListResponse:
    properties:
      shows:
        items:
          $ref: '#/definitions/httpapi.ShowResponse'
        type: array
    type: object
  httpapi.ShowResponse:
    properties:
      id:
        example: 1
        type: integer
      starts_at:
        example: "2027-01-25T13:30:00Z"
        type: string
      title:
        example: Coldplay Live
        type: string
      venue:
        example: DY Patil Stadium, Navi Mumbai
        type: string
    type: object
  httpapi.StatusResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
info:
  contact: {}
  description: |-
    High-concurrency ticket booking backend. A seat can never be booked twice:
    PostgreSQL's UNIQUE(show_id, seat_id) constraint is the final authority.
  title: SeatLock API
  version: "1.0"
paths:
  /healthz:
    get:
      description: Returns 200 while the process is running. Does not check dependencies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.StatusResponse'
      summary: Liveness check
      tags:
      - health
  /readyz:
    get:
      description: Returns 200 only if PostgreSQL answers a ping within 1 second,
        otherwise 503.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.StatusResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.StatusResponse'
      summary: Readiness check
      tags:
      - health
  /v1/bookings:
    post:
      consumes:
      - application/json
      description: |-
        Books one seat directly (no holds in Phase 1). If several users book the
        same seat at once, exactly one gets 201 and the rest get 409.
      parameters:
      - description: Who is booking
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: Seat to book
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateBookingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.BookingResponse'
        "400":
          description: Bad input or missing X-User-ID
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Show or seat not found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Seat already booked
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Book a seat
      tags:
      - bookings
  /v1/bookings/{bookingID}:
    get:
      parameters:
      - description: Booking ID
        in: path
        name: bookingID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.BookingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get a booking
      tags:
      - bookings
  /v1/shows:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ShowListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: List shows
      tags:
      - shows
  /v1/shows/{showID}/seats:
    get:
      description: Every seat of the show with its price and status (AVAILABLE or
        BOOKED).
      parameters:
      - description: Show ID
        in: path
        name: showID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.SeatMapResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Seat map of a show
      tags:
      - shows
swagger: "2.0"
