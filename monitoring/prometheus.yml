# prometheus.yml - what Prometheus scrapes, and which alert rules it evaluates.
#
# Scrapes every 5s (a demo-friendly resolution; production would use 15-30s).
# The api and worker serve /metrics on INTERNAL ports (9091, 9092) that are
# reachable only inside the Compose network, never published to the host.
#
# dns_sd_configs (type A) resolves the Compose service name to ALL its
# containers, so `docker compose up --scale worker=2` is scraped without
# config changes; each replica becomes its own "instance". The api job
# resolves the alias "api-replicas", shared by api and (profile "scale")
# api-2, so both replicas are job="api" and the dashboard sums them.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api-replicas]
        type: A
        port: 9091
        refresh_interval: 15s

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9092
        refresh_interval: 15s

  - job_name: payment-mock
    static_configs:
      - targets: ["payment:8090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
