# nginx load balancer for the `scale` Compose profile (make up-scale):
# two api replicas (api, api-2) behind one entry point, lb:80 inside the
# Compose network, http://localhost:${LB_PORT:-8088} on the host.
#
# Both replicas share the network alias "api-replicas". `resolve` makes
# nginx re-resolve it (Docker's DNS at 127.0.0.11, every 5 s), so a replica
# that is killed drops out and one that comes back is used again.

upstream seatlock_api {
    zone seatlock_api 64k;
    server api-replicas:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 64;
}

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location / {
        proxy_pass http://seatlock_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 1s;
        proxy_read_timeout 30s;

        # Retries by the LOAD BALANCER: only when the request could not be
        # delivered (connection refused/reset before it was sent, or a
        # connect timeout). nginx never resends a POST that already reached
        # a replica, and we deliberately do NOT add `non_idempotent` here:
        # a POST /v1/bookings that reached a replica may already have charged
        # the card. Retrying it is the CLIENT's job, with the same
        # Idempotency-Key, so SeatLock can answer "already done" instead of
        # charging twice. A load balancer has no key and cannot know.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }

    location = /lb-health {
        access_log off;
        return 200 "ok\n";
    }
}
