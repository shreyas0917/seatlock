# Local development stack.
#   postgres : source of truth for shows, seats and bookings
#   redis    : fast seat lock for holds (an optimisation; Postgres is the authority)
#   payment  : mock payment gateway (separate binary, cmd/payment)
#   api      : the SeatLock Go server
#   worker   : background jobs (reconciler, outbox drainer, hold expirer, invariants, key cleanup)
#   prometheus, grafana : metrics, alerts and the "SeatLock — Reliability" dashboard
#   api-2, lb (profile "scale" only, `make up-scale`): a second api replica
#             behind an nginx load balancer, for the replica-kill chaos test
# Values come from .env if it exists (see .env.example), otherwise the defaults after ":-".

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seatlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatlock}
      POSTGRES_DB: ${POSTGRES_DB:-seatlock}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the seatlock_test database on first start (used by integration tests).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seatlock} -d ${POSTGRES_DB:-seatlock}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mock payment gateway (internal/paymentmock). In-memory state; demos
  # control it with POST /debug/next-behavior and POST /debug/reset.
  payment:
    build:
      context: .
      target: payment
    environment:
      PAYMENT_ADDR: ":8090"
      PAYMENT_FAIL_RATE: ${PAYMENT_FAIL_RATE:-0}
      PAYMENT_MIN_DELAY: ${PAYMENT_MIN_DELAY:-0s}
      PAYMENT_MAX_DELAY: ${PAYMENT_MAX_DELAY:-0s}
      PAYMENT_SLOW_DELAY: ${PAYMENT_SLOW_DELAY:-3s}
    ports:
      # Host port 8095 (8090 is often taken); inside the Compose network it is payment:8090.
      - "${PAYMENT_PORT:-8095}:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    # Named explicitly so the second replica (api-2) can run the SAME image.
    image: seatlock-api
    environment: &app-env
      HTTP_ADDR: ":8080"
      # Inside the Compose network, Postgres is reachable at host "postgres", port 5432.
      DATABASE_URL: postgres://${POSTGRES_USER:-seatlock}:${POSTGRES_PASSWORD:-seatlock}@postgres:5432/${POSTGRES_DB:-seatlock}?sslmode=disable
      RUN_MIGRATIONS: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-5}
      DB_QUERY_TIMEOUT: ${DB_QUERY_TIMEOUT:-3s}
      # Inside the Compose network, Redis is reachable at host "redis".
      REDIS_ADDR: redis:6379
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT:-200ms}
      REDIS_READ_TIMEOUT: ${REDIS_READ_TIMEOUT:-200ms}
      REDIS_WRITE_TIMEOUT: ${REDIS_WRITE_TIMEOUT:-200ms}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-10}
      HOLD_TTL: ${HOLD_TTL:-300s}
      REDIS_LOCK_EXTRA: ${REDIS_LOCK_EXTRA:-10s}
      # Inside the Compose network, the mock gateway is reachable at host "payment".
      PAYMENT_URL: http://payment:8090
      PAYMENT_TIMEOUT: ${PAYMENT_TIMEOUT:-5s}
      IDEMPOTENCY_LEASE: ${IDEMPOTENCY_LEASE:-30s}
      PENDING_HOLD_MAX: ${PENDING_HOLD_MAX:-10m}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-20}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-50}
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-30s}
      RECONCILE_AFTER: ${RECONCILE_AFTER:-2m}
      RECONCILE_LEASE: ${RECONCILE_LEASE:-60s}
      OUTBOX_INTERVAL: ${OUTBOX_INTERVAL:-5s}
      OUTBOX_LEASE: ${OUTBOX_LEASE:-60s}
      EXPIRE_INTERVAL: ${EXPIRE_INTERVAL:-10s}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-1h}
      IDEMPOTENCY_RETENTION: ${IDEMPOTENCY_RETENTION:-24h}
      # Block/mutex profiles at :9091|:9092/debug/pprof (internal ports). 0 = off.
      PPROF_BLOCK_RATE: ${PPROF_BLOCK_RATE:-0}
      PPROF_MUTEX_FRACTION: ${PPROF_MUTEX_FRACTION:-0}
    ports:
      - "8080:8080"
    networks:
      default:
        # Shared by every api replica (api, api-2): the load balancer and
        # Prometheus resolve this name to ALL replicas that are running.
        aliases: [api-replicas]
    # The api waits for a healthy Postgres (nothing works without it), but
    # deliberately NOT for a healthy Redis: with Redis down the api must still
    # start and serve confirms and reads (new holds fail closed with 503).
    # "service_started" only orders startup; it does not require health.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Second api replica (profile "scale"): the SAME image as api (built by
  # the api service, never pulled) and the same settings; no host port,
  # reached through the load balancer (lb) or as api-2:8080.
  api-2:
    profiles: [scale]
    image: seatlock-api
    pull_policy: never
    environment: *app-env
    networks:
      default:
        aliases: [api-replicas]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # Start after the first replica, so migrations run once, in one place.
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # nginx load balancer in front of both replicas (profile "scale"),
  # config in deploy/lb/nginx.conf. Inside the network: http://lb.
  lb:
    profiles: [scale]
    image: nginx:1.31.5-alpine
    volumes:
      - ./deploy/lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${LB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/lb-health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Background worker (cmd/worker): reconciles abandoned payments, drains the
  # outbox, expires holds, cleans up idempotency keys. Same settings as the
  # api (YAML anchor), so both apply the same rules. Safe to scale:
  # `docker compose up -d --scale worker=2`.
  worker:
    build:
      context: .
      target: worker
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      payment:
        condition: service_started

  # ---------------------------------------------------------- observability
  # Prometheus scrapes the api, worker and payment mock every 5s (their
  # /metrics ports are reachable only inside this Compose network) and
  # evaluates monitoring/alerts.yml. Pinned version; memory capped so it
  # cannot starve the rest of the stack; 2 days of data is plenty for demos.
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9095}:9090"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Grafana: the project's "UI". Datasource and dashboard are provisioned
  # from monitoring/grafana, and anonymous VIEWER access is on, so
  # http://localhost:3001 opens the SeatLock dashboard with no manual setup.
  # (Admin login for editing: admin / GRAFANA_ADMIN_PASSWORD, default admin.)
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/seatlock-reliability.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    # 512 MB: Grafana touched 256 MB in Phase 5 and 367 of 384 MB in the
    # Phase 6 verification run (no restart either time, but no headroom).
    mem_limit: 512m
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      # The FIRST start runs Grafana's own database migrations (a few
      # minutes on a loaded laptop); failures during this period don't count.
      start_period: 300s

volumes:
  pgdata:
  promdata:
